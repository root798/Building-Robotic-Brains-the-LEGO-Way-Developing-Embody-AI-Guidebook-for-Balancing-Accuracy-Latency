name: Validate training publication

on:
  push:
    branches: [main, 'training/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate portable configuration snapshots
        run: python -m unittest discover -s tests -p 'test_training_configs.py'
      - name: Validate documentation and public artifact boundaries
        run: python -m unittest discover -s tests -p 'test_publication.py'
      - name: Validate fresh-run entry point without ML dependencies
        run: python -m unittest discover -s tests -p 'test_train_cli.py'
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
